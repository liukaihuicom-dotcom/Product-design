<!--
  LoadingState component
  Usage: <div class="ui-loading"><span class="ui-loading__spinner"></span><span>Loading review queue...</span></div>
-->
<style>
  .ui-loading {
    display: inline-flex;
    align-items: center;
    gap: var(--space-8);
    color: var(--color-text-secondary);
  }

  .ui-loading__spinner {
    width: 18px;
    height: 18px;
    border: 2px solid var(--color-border-strong);
    border-top-color: var(--color-brand-primary);
    border-radius: var(--radius-pill);
    animation: ui-spin 0.8s linear infinite;
  }

  .ui-skeleton {
    position: relative;
    overflow: hidden;
    min-height: 18px;
    border-radius: var(--radius-xs);
    background: var(--color-border-default);
  }

  .ui-skeleton::after {
    position: absolute;
    inset: 0;
    transform: translateX(-100%);
    animation: ui-shimmer 1.4s infinite;
    background: linear-gradient(90deg, transparent, var(--color-shimmer), transparent);
    content: "";
  }

  @keyframes ui-shimmer {
    to {
      transform: translateX(100%);
    }
  }
</style>
