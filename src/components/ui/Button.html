<!--
  Button component
  Variants: primary, secondary, ghost, danger
  Sizes: sm, md, lg
  Usage: <button class="ui-button ui-button--primary ui-button--md">Submit for Review</button>
-->
<style>
  .ui-button {
    display: inline-flex;
    min-width: max-content;
    align-items: center;
    justify-content: center;
    gap: var(--space-8);
    border: 1px solid transparent;
    border-radius: var(--button-radius);
    font-weight: var(--font-weight-semibold);
    line-height: 1;
    text-decoration: none;
    transition: background var(--transition-fast), border-color var(--transition-fast), color var(--transition-fast), box-shadow var(--transition-fast);
  }

  .ui-button--sm {
    height: var(--button-height-sm);
    padding: 0 var(--space-12);
    font-size: var(--font-size-caption);
  }

  .ui-button--md {
    height: var(--button-height-md);
    padding: 0 var(--space-16);
  }

  .ui-button--lg {
    height: var(--button-height-lg);
    padding: 0 var(--space-20);
    font-size: var(--font-size-body-lg);
  }

  .ui-button--primary {
    background: var(--color-brand-accent);
    color: var(--color-brand-primary);
  }

  .ui-button--primary:hover {
    background: var(--color-brand-accent-hover);
  }

  .ui-button--secondary {
    border-color: var(--color-border-strong);
    background: var(--color-bg-surface);
    color: var(--color-text-primary);
  }

  .ui-button--secondary:hover {
    background: var(--color-bg-subtle);
  }

  .ui-button--ghost {
    background: transparent;
    color: var(--color-brand-primary);
  }

  .ui-button--ghost:hover {
    background: var(--color-bg-brand-soft);
  }

  .ui-button--danger {
    background: var(--color-danger);
    color: var(--color-text-inverse);
  }

  .ui-button--danger:hover {
    box-shadow: 0 0 0 4px var(--color-danger-focus);
  }

  .ui-button:disabled,
  .ui-button[aria-disabled="true"] {
    opacity: 0.48;
    pointer-events: none;
  }

  .ui-button__spinner {
    width: 14px;
    height: 14px;
    border: 2px solid currentColor;
    border-top-color: transparent;
    border-radius: var(--radius-pill);
    animation: ui-spin 0.8s linear infinite;
  }

  @keyframes ui-spin {
    to {
      transform: rotate(360deg);
    }
  }
</style>
