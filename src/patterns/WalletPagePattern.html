<!-- Wallet / Funds Page Pattern -->
<main class="app-shell">
  <header class="page-header">
    <div>
      <p class="page-kicker">Funds</p>
      <h1 class="page-title">Wallet Overview</h1>
      <p class="page-subtitle">Make balance, currency, pending movements, and compliance blocks easy to scan.</p>
    </div>
  </header>

  <div class="layout-grid">
    <section class="stack">
      <article class="ui-card ui-card--elevated">
        <h2 class="ui-card__title">Balance Summary</h2>
      </article>
      <article class="ui-card">
        <h2 class="ui-card__title">Transaction History</h2>
      </article>
    </section>
    <aside class="stack">
      <section class="ui-card">
        <h2 class="ui-card__title">Transfer Funds</h2>
      </section>
      <div class="ui-alert ui-alert--warning">
        <strong>Compliance requirement</strong>
        <span>If fund movement is blocked, explain the exact requirement and next step.</span>
      </div>
    </aside>
  </div>
</main>
