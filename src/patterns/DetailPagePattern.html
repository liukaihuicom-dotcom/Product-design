<!-- Detail Page Pattern -->
<main class="app-shell">
  <header class="page-header">
    <div>
      <p class="page-kicker">Account detail</p>
      <h1 class="page-title">Trading Account Detail</h1>
      <p class="page-subtitle">Show current status, financial summary, history, and available actions.</p>
    </div>
    <span class="ui-status ui-status--warning">Reviewing</span>
  </header>

  <div class="layout-grid">
    <section class="stack">
      <article class="ui-card ui-card--elevated">
        <h2 class="ui-card__title">Key Summary</h2>
      </article>
      <article class="ui-card">
        <h2 class="ui-card__title">Timeline</h2>
      </article>
    </section>
    <aside class="stack">
      <section class="ui-card">
        <h2 class="ui-card__title">Actions</h2>
      </section>
      <div class="ui-alert ui-alert--warning">
        <strong>Compliance note</strong>
        <span>Explain any restriction that affects account access or money movement.</span>
      </div>
    </aside>
  </div>
</main>
