<!-- Dashboard Page Pattern -->
<main class="app-shell">
  <header class="page-header">
    <div>
      <p class="page-kicker">Broker operations</p>
      <h1 class="page-title">Dashboard</h1>
      <p class="page-subtitle">Monitor account health, risk items, and pending operational work.</p>
    </div>
    <button class="ui-button ui-button--primary ui-button--md">Review Action Required</button>
  </header>

  <section class="stack">
    <div class="ui-alert ui-alert--warning">
      <strong>Risk items require attention</strong>
      <span>Review pending KYC, failed deposits, and blocked withdrawals before processing secondary tasks.</span>
    </div>
    <div class="layout-grid">
      <section class="ui-card ui-card--elevated">
        <h2 class="ui-card__title">Key Metrics</h2>
      </section>
      <aside class="ui-card">
        <h2 class="ui-card__title">Secondary Modules</h2>
      </aside>
    </div>
  </section>
</main>
