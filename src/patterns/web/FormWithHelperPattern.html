<!-- Web Form With Helper Pattern -->
<main class="web-shell" data-platform="web">
  <header class="page-header">
    <div>
      <p class="page-kicker">Funds</p>
      <h1 class="page-title">Submit Deposit</h1>
      <p class="page-subtitle">Use form card plus side compliance helper on web.</p>
    </div>
  </header>
  <div class="layout-grid">
    <form class="ui-card stack">
      <label class="ui-field"><span class="ui-field__label">Trading account</span><select class="ui-select"><option>ACC-28194 · USD</option></select></label>
      <label class="ui-field"><span class="ui-field__label">Amount</span><input class="ui-input" value="1,250.00"></label>
      <button class="ui-button ui-button--primary ui-button--md">Submit Deposit</button>
    </form>
    <aside class="ui-alert ui-alert--info"><strong>Compliance note</strong><span>Explain verification and crediting rules.</span></aside>
  </div>
</main>
