<!-- Web Review Center Pattern -->
<main class="web-shell" data-platform="web">
  <header class="page-header">
    <div>
      <p class="page-kicker">Compliance operations</p>
      <h1 class="page-title">Review Center</h1>
      <p class="page-subtitle">Use web table, filters, queue summary, and decision panel.</p>
    </div>
  </header>
  <section class="stack">
    <div class="cluster">
      <label class="ui-field">
        <span class="ui-field__label">Status</span>
        <select class="ui-select"><option>All active statuses</option></select>
      </label>
      <label class="ui-field">
        <span class="ui-field__label">Search</span>
        <input class="ui-input" placeholder="Case ID or account">
      </label>
    </div>
    <div class="ui-table-wrap">
      <table class="ui-table">
        <thead>
          <tr><th>Case</th><th>Status</th><th>Risk</th><th class="is-right">Amount</th><th class="is-actions">Action</th></tr>
        </thead>
      </table>
    </div>
  </section>
</main>
