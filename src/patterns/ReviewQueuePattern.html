<!-- Review Queue Pattern -->
<main class="app-shell">
  <header class="page-header">
    <div>
      <p class="page-kicker">Compliance operations</p>
      <h1 class="page-title">Review Queue</h1>
      <p class="page-subtitle">Prioritize high-risk cases, SLA breaches, and blocked financial actions.</p>
    </div>
  </header>

  <section class="stack">
    <div class="cluster">
      <label class="ui-field">
        <span class="ui-field__label">Status</span>
        <select class="ui-select">
          <option>All statuses</option>
        </select>
      </label>
      <label class="ui-field">
        <span class="ui-field__label">Risk level</span>
        <select class="ui-select">
          <option>All risks</option>
        </select>
      </label>
    </div>
    <div class="ui-table-wrap">
      <table class="ui-table">
        <thead>
          <tr>
            <th>Case</th>
            <th>Status</th>
            <th>Risk</th>
            <th>SLA</th>
            <th class="is-actions">Action</th>
          </tr>
        </thead>
      </table>
    </div>
  </section>
</main>
