<!-- App Deposit Form Pattern -->
<main class="app-frame" data-platform="app">
  <header class="app-header">
    <button class="ui-button ui-button--ghost ui-button--sm" aria-label="Back"><span class="icon icon-sm icon-primary icon--asset icon-arrow-left" aria-hidden="true"></span></button>
    <h1 class="ui-card__title">Deposit</h1>
    <span></span>
  </header>
  <section class="stack">
    <label class="ui-field"><span class="ui-field__label">Amount</span><input class="ui-input" inputmode="decimal" value="1,250.00"></label>
    <button class="ui-button ui-button--secondary ui-button--md">Choose payment method</button>
    <div class="ui-alert ui-alert--warning"><strong>Verification may be required</strong><span>Funds are credited after approval.</span></div>
  </section>
  <div class="sticky-bottom-action">
    <button class="ui-button ui-button--primary ui-button--lg">Submit Deposit</button>
  </div>
</main>
