<!-- App Records Card List Pattern -->
<main class="app-frame" data-platform="app">
  <header class="app-header">
    <h1 class="ui-card__title">Records</h1>
    <button class="ui-button ui-button--ghost ui-button--sm"><span class="icon icon-sm icon-primary icon--asset icon-filter" aria-hidden="true"></span>Filter</button>
  </header>
  <section class="stack">
    <article class="ui-card">
      <div class="split">
        <strong>Withdrawal reviewing</strong>
        <span class="amount">USD 18,420.00</span>
      </div>
      <p class="metadata">WD-8891 · 13 May 2026</p>
      <span class="ui-status ui-status--warning">Reviewing</span>
    </article>
  </section>
</main>
