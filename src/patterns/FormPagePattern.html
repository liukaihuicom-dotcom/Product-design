<!-- Form Page Pattern -->
<main class="app-shell">
  <header class="page-header">
    <div>
      <p class="page-kicker">Verification</p>
      <h1 class="page-title">Submit Verification</h1>
      <p class="page-subtitle">Collect required information with clear labels, requirements, and validation states.</p>
    </div>
  </header>

  <div class="layout-grid">
    <form class="ui-card ui-card--elevated stack">
      <label class="ui-field">
        <span class="ui-field__label">Legal name</span>
        <input class="ui-input" placeholder="Enter legal name">
      </label>
      <button class="ui-button ui-button--primary ui-button--md" type="submit">Submit for Review</button>
    </form>
    <aside class="ui-alert ui-alert--info">
      <strong>Why this is required</strong>
      <span>Explain the compliance reason and what happens after submission.</span>
    </aside>
  </div>
</main>
